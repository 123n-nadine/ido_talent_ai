[project]
name = "ido_talent_ai"
authors = [{ name = "i-do Holding", email = "nadien222101510@gmail.com" }]
description = "AI screening and ranking for the Frappe HRMS recruitment module (adapter for talent-engine)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
